<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Diri Saya</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px;">

    <div style="max-width: 500px; background-color: white; margin: 20px auto; padding: 20px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1);">
        
        <h2 style="text-align: center; color: #333; margin-bottom: 20px;">Biodata Diri</h2>
        
        <table style="width: 100%; border-collapse: collapse;">
            <tr>
                <td style="padding: 8px; font-weight: bold; width: 35%; vertical-align: top;">Nama Lengkap</td>
                <td style="padding: 8px; vertical-align: top;">: Nama Anda Disini</td>
            </tr>
            <tr>
                <td style="padding: 8px; font-weight: bold; vertical-align: top;">Nama Panggilan</td>
                <td style="padding: 8px; vertical-align: top;">: Panggilan Anda</td>
            </tr>
            <tr>
                <td style="padding: 8px; font-weight: bold; vertical-align: top;">Tempat, Tgl Lahir</td>
                <td style="padding: 8px; vertical-align: top;">: Kota, DD Bulan YYYY</td>
            </tr>
            <tr>
                <td style="padding: 8px; font-weight: bold; vertical-align: top;">Jenis Kelamin</td>
                <td style="padding: 8px; vertical-align: top;">: Laki-laki / Perempuan</td>
            </tr>
            <tr>
                <td style="padding: 8px; font-weight: bold; vertical-align: top;">Alamat</td>
                <td style="padding: 8px; vertical-align: top;">: Alamat rumah Anda</td>
            </tr>
            <tr>
                <td style="padding: 8px; font-weight: bold; vertical-align: top;">Email</td>
                <td style="padding: 8px; vertical-align: top;">: email@example.com</td>
            </tr>
            <tr>
                <td style="padding: 8px; font-weight: bold; vertical-align: top;">Hobi</td>
                <td style="padding: 8px; vertical-align: top;">: Membaca, Menulis, dll</td>
            </tr>
            <tr>
                <td style="padding: 8px; font-weight: bold; vertical-align: top;">Cita-cita</td>
                <td style="padding: 8px; vertical-align: top;">: Programmer</td>
            </tr>
        </table>

    </div>

</body>
</html>
